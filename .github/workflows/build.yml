# ========================================
# GKI Kernel Build Workflow
# ========================================
# This workflow compiles the Android GKI kernel, supporting multiple KernelSU variants and SUSFS
# Called by other workflows via workflow_call, not triggered manually
# ========================================

name: Kernel Build Pipeline

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== Base Configuration ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU Configuration ====================
      ksu_variant:
        required: true
        type: string
      ksu_branch:
        required: true
        type: string

      # ==================== Optional Configuration ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Feature Toggles ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_kpm:
        required: true
        type: boolean
        default: true
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ==================== Environment Variable Configuration ====================
    # ccache configuration to speed up repeated builds
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # ==================== Build Info Summary ====================
      # Print all current build configuration info for debugging and tracking
      - name: Build Info Summary
        run: |
          echo "========================================"
          echo "       Kernel Build Configuration Summary"
          echo "========================================"
          echo "Android Version : ${{ inputs.android_version }}"
          echo "Kernel Version  : ${{ inputs.kernel_version }}"
          echo "Sub-level       : ${{ inputs.sub_level }}"
          echo "Patch Level     : ${{ inputs.os_patch_level }}"
          echo "KSU Variant     : ${{ inputs.ksu_variant }}"
          echo "KSU Branch      : ${{ inputs.ksu_branch }}"
          echo "Build Time      : ${{ inputs.build_time }}"
          echo "SUSFS Status    : ${{ inputs.enable_susfs }}"
          echo "ZRAM Enhancement: ${{ inputs.use_zram }}"
          echo "BBG Patch       : ${{ inputs.use_bbg }}"
          echo "KPM Feature     : ${{ inputs.use_kpm }}"
          echo "Stock Config    : Auto-detect config/stock_defconfig"
          echo "========================================"

      # ==================== Clean Disk Space ====================
      # GitHub Actions has limited disk space by default; remove unnecessary pre-installed software
      - name: Clean Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      # ==================== Checkout Repository ====================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================== Initialize Build Environment ====================
      # Set various path variables including kernel source, patches, tools directories
      - name: Initialize Build Environment
        run: |
          # Build configuration identifier
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          # Export environment variables for subsequent steps
          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          # Download and configure the repo tool (for syncing Android kernel source)
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # ==================== Display Config File Contents ====================
      - name: Display Configuration Info
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Loading config file: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      # ==================== Install Build Dependencies ====================
      # Install tools and libraries required for kernel compilation (using apt cache for speed)
      - name: Install Build Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves
          execute_install_scripts: true

      # ==================== Configure ccache ====================
      # ccache is used to cache compilation results and speed up subsequent builds
      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ==================== Restore ccache Cache ====================
      - name: Restore ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # ==================== Cache Toolchain ====================
      # Cache AOSP build tools to avoid re-downloading every time
      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      # ==================== Download Toolchain ====================
      # Download kernel build tools and mkbootimg from AOSP mirror
      - name: Download Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      # ==================== Generate Signing Key ====================
      # Generate RSA key for boot.img signing
      - name: Generate Signing Key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      # ==================== Configure Git ====================
      - name: Configure Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      # ==================== Clone Dependency Repositories ====================
      # Clone AnyKernel3, SUSFS, and various patch repositories
      - name: Clone Dependency Repositories
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "Cloning AnyKernel3..."
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "Cloning SUSFS (branch: $SUSFS_BRANCH)..."
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            # SukiSU uses ShirkNeko's SUSFS branch
            git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH"
          elif [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ]; then
            # ReSukiSU uses simonpunk's original SUSFS
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          else
            # Other variants use simonpunk's original SUSFS
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          fi

          # Check if custom commit is enabled
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "Switching SUSFS to custom commit: $CUSTOM_COMMIT"
                cd susfs4ksu
                git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS repository latest commit date: $SUSFS_LATEST_COMMIT_DATE"

          echo "Preparing patch resources..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "Using current repository patch directory: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      # ==================== Initialize and Sync Kernel Source ====================
      # Use the repo tool to fetch GKI kernel source from AOSP
      - name: Initialize and Sync Kernel Source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          # Clone GCC toolchain (for 5.x kernels)
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git gcc

          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "Initializing repo, branch: common-${FORMATTED_BRANCH}"

          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

          # Check if this is a deprecated branch
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Detected deprecated branch: $FORMATTED_BRANCH"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi

          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV

      # ==================== Spoof /proc/config.gz (Auto-detect) ====================
      # If config/stock_defconfig exists in the repo, apply it automatically; otherwise skip
      - name: Apply Stock Config Spoof
        run: |
          # Source and destination paths for stock_defconfig
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          # Skip directly if stock_defconfig is not provided, does not affect main flow
          if [ ! -f "$STOCK_SRC" ]; then
            echo "No $STOCK_SRC detected, skipping Stock Config spoof."
            exit 0
          fi

          # Ensure the destination directory exists beforehand to avoid cp failure
          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::Failed to copy stock_defconfig: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "Copied stock_defconfig -> $STOCK_DST"

          # Rule replacement target: fixed to common/kernel/Makefile (consistent with current directory structure)
          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          # Fail immediately if target Makefile is not found, to prevent accidentally modifying other files
          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::$TARGET_MAKEFILE not found"
            exit 1
          fi

          # Only two states allowed: already new rule / old rule found and replaced; any other case is an error
          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data rule is already stock_defconfig, skipping."
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|\$(obj)/config_data: \$(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "Replaced config_data rule: $TARGET_MAKEFILE"
          else
            echo "::error::Rule not found in $TARGET_MAKEFILE: $OLD_RULE"
            exit 1
          fi

      # ==================== Extract Actual Sub-level ====================
      # Read the actual SUBLEVEL value from the Makefile
      - name: Extract Actual Sub-level
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "Actual sub-level: $ACTUAL_SUBLEVEL"

      # ==================== Fix glibc 2.38 Compatibility Issues ====================
      # Some older kernels fail to compile on newer glibc versions and require patching
      - name: Fix glibc 2.38 Compatibility
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="${{ inputs.sub_level }}"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "Applying glibc 2.38 compatibility fix..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      # ==================== OnePlus 8E Processor Support ====================
      # Add support patches for the OnePlus 8E processor model
      - name: Add OnePlus 8E Processor Support
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "Downloading OnePlus 8E support patch..."
          curl -LSs "https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile

      # ==================== Determine KernelSU Branch ====================
      # Determine the actual Git branch based on user-selected variant and branch
      - name: Determine KernelSU Branch
        id: ksu-branch
        run: |
          branch_input="${{ inputs.ksu_branch }}"
          variant_input="${{ inputs.ksu_variant }}"

          case "$branch_input" in
            "Stable(Standard)")
              case "$variant_input" in
                "Next") BRANCH="-s stable" ;;
                "SukiSU"|"ReSukiSU") BRANCH="-s builtin" ;;
                "Official"|"MKSU") BRANCH="-s main" ;;
                *) BRANCH="-" ;;
              esac
              ;;
            "Dev(Development)")
              case "$variant_input" in
                "Official"|"MKSU") BRANCH="-s main" ;;
                "Next") BRANCH="-s dev" ;;
                "SukiSU"|"ReSukiSU") BRANCH="-s builtin" ;;
                *) echo "Unknown variant: $variant_input" >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "Unknown branch: $branch_input" >&2
              exit 1
              ;;
          esac

          # Force main branch when SUSFS is disabled for SukiSU/ReSukiSU
          if [ "$variant_input" = "SukiSU" ] || [ "$variant_input" = "ReSukiSU" ]; then
            if [ "${{ inputs.enable_susfs }}" = "false" ]; then
              BRANCH="-s main"
            fi
          fi

          # Check if custom commit is enabled (applies to SukiSU only)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU using custom commit: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU Branch: $BRANCH"

      # ==================== Add KernelSU ====================
      # Add the corresponding KernelSU based on the selected variant
      - name: Add KernelSU
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          case "${{ inputs.ksu_variant }}" in
            "Official")
              echo "Adding KernelSU Official..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash $BRANCH

              # Calculate and set KSU version number
              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
              echo "Calculated KSU version: $KSU_VERSION"

              # Update version number in Kbuild
              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
                echo "Updated version number in kernel/Kbuild"
              fi
              cd ..
              ;;
            "Next")
              echo "Adding KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev_susfs
              ;;
            "MKSU")
              echo "Adding MKSU..."
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash $BRANCH

              # Calculate and set KSU version number
              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
              echo "Calculated KSU version: $KSU_VERSION"

              # Update version number in Kbuild
              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
                echo "Updated version number in kernel/Kbuild"
              fi
              cd ..
              ;;
            "SukiSU")
              echo "Adding SukiSU..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
            "ReSukiSU")
              echo "Adding ReSukiSU..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash $BRANCH
              ;;
          esac

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
            echo "KSU repository latest commit date: $KSU_LATEST_COMMIT_DATE"
          else
            echo "KSU_LATEST_COMMIT_DATE=Unknown" >> $GITHUB_ENV
          fi

      # ==================== Configure SukiSU Manager Info ====================
      - name: Configure SukiSU Manager Info
        if: inputs.ksu_variant == 'SukiSU' && vars.MANAGER_STR != ''
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
        run: |
          sed -i 's/\(v\$1-\).*\(@\$\)/\1${{ vars.MANAGER_STR }}\2/' ./kernel/Makefile

      # ==================== Apply SUSFS Patches ====================
      # SUSFS (Super User SUS FileSystem) is used to hide root traces
      - name: Apply SUSFS Patches
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Applying SUSFS patches..."
          SUSFS_VERSION="2.0.0"

          # Copy SUSFS base files
          cp $SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp $SUSFS4KSU/kernel_patches/fs/* ./common/fs/
          cp $SUSFS4KSU/kernel_patches/include/linux/* ./common/include/linux/

          case "${{ inputs.ksu_variant }}" in
            "Official"|"MKSU")
              cd ./KernelSU
              cp $SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./

              # Fix patch format (Makefile → Kbuild)
              sed -i 's|kernel/Makefile|kernel/Kbuild|g' ./10_enable_susfs_for_ksu.patch

              # Fix patch context lines
              sed -i 's|^@@ .* format:.*|@@ -94,4 +94,13 @@|' ./10_enable_susfs_for_ksu.patch

              # Fix compilation warning configuration
              sed -i 's|.*check-format:.*| ccflags-y += -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-missing-prototypes|' ./10_enable_susfs_for_ksu.patch
              sed -i 's|.*clang-format --dry-run.*| ccflags-y += -Wno-declaration-after-statement -Wno-unused-function -Wno-unused-variable|' ./10_enable_susfs_for_ksu.patch

              # Apply patch
              patch -p1 < 10_enable_susfs_for_ksu.patch || true
              cd ..
              ;;
            "Next"|"SukiSU"|"ReSukiSU")
              echo "Next/SukiSU/ReSukiSU uses built-in SUSFS support"
              ;;
          esac

          # Apply main SUSFS patch to the kernel
          cd $KERNEL_ROOT/common
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          # Apply version-specific fixes (all KSU variants)
          if [ "${{ inputs.ksu_variant }}" == "Official" ] || [ "${{ inputs.ksu_variant }}" == "MKSU" ] || [ "${{ inputs.ksu_variant }}" == "Next" ] || [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ]; then
            CURRENT_SUB="${{ inputs.sub_level }}"
            if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
              CURRENT_SUB=99999
            fi

            # Android 12 - 5.10 Fix
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
              if [[ "$CURRENT_SUB" -le 209 ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
              if [[ "$CURRENT_SUB" -le 117 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/fdinfo.c.patch ./
                patch -p1 < fdinfo.c.patch || true
              fi
              if [[ "$CURRENT_SUB" -le 43 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
            fi
          

            # Android 13 - 5.15 Fix
            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]]; then
              if [[ "$CURRENT_SUB" -le 41 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/namespace.c.patch ./
                patch -p1 < namespace.c.patch || true
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/fdinfo.c.patch ./
                patch -p1 < fdinfo.c.patch || true
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/open.c.patch ./
                patch -p1 < open.c.patch || true
                sed -i 's|is_i_uid_not_allowed(i_uid_into_mnt(i_user_ns(inode), inode).val)))|is_i_uid_not_allowed(inode->i_uid.val)))|g' fs/susfs.c
              fi
              if [[ "$CURRENT_SUB" -le 148 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi


            # Android 14 - 6.1 Fix
            if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
              if [[ "$CURRENT_SUB" -le 138 || "$CURRENT_SUB" -ge 145 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
              if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              if grep -q 'susfs_is_current_proc_umounted' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs.h>' ./fs/proc/base.c; then
                sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs.h>' ./fs/proc/base.c
              fi
              if [[ "$CURRENT_SUB" -le 75 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi

            # Android 15 - 6.6 Fix
            if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
              if [[ "$CURRENT_SUB" -ge 98 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a15-6.6/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
              if [[ "$CURRENT_SUB" -le 58 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a15-6.6/task_mmu.c.patch ./
                patch -p1 < task_mmu.c.patch || true
              fi
            fi
          fi

      # ==================== Unicode Bypass Fix ====================
      # Fix the issue of Unicode zero-width characters bypassing detection
      - name: Apply Unicode Bypass Fix
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      # ==================== Upgrade LZ4 and Apply LZ4KD/LZ4K_OPLUS Patches ====================
      # Unified handling of ZRAM-related LZ4 changes to reduce duplicate steps
      - name: Configure ZRAM LZ4 Patch Stack
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Phase 1: Upgrade LZ4 to 1.10.0
          echo "Upgrading LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          cp $ZZH_PATCHES/zram/${{ inputs.kernel_version }}/lz4_1.10.0.patch ./
          patch -p1 -F 3 --fuzz=5 < lz4_1.10.0.patch || true

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          # Phase 2: Apply LZ4KD and LZ4K_OPLUS patches
          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          patch -p1 -F 3 < lz4k_oplus.patch || true

      # ==================== Fix 6.6 WiFi/Bluetooth Compatibility (Samsung + Xiaomi) ====================
      # Merge Samsung and Xiaomi fixes using idempotent writes to avoid dirty changes from repeated appends
      - name: Fix 6.6 WiFi/Bluetooth Compatibility (Samsung + Xiaomi)
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # Append only if line does not exist, to avoid polluting files on repeated runs
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::File does not exist: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          # Samsung: Add KDP symbols (idempotent)
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          # Samsung: Patch only when applicable; skip if already applied or context mismatch
          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::Patch does not exist: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "min_kdp symbols patch already applied or context mismatch, skipping."
          fi

          # Samsung: Copy driver source and ensure Makefile is only appended once
          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::File does not exist: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          # Xiaomi: Add symbols (idempotent)
          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      # ==================== Configure ZRAM Options ====================
      # Enable various ZRAM compression algorithms
      - name: Configure ZRAM Options
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
            echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_842=y
          CONFIG_CRYPTO_LZ4K_OPLUS=y
          EOF
          fi

      # ==================== Add BBG Anti-Format Patch ====================
      # BBG (Baseband Guard) prevents baseband format attacks
      - name: Add BBG Anti-Format Patch
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      # ==================== Configure Kernel Options ====================
      # Add KernelSU and other required kernel configurations
      - name: Configure Kernel Options
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.ksu_variant }}" == "Next" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          fi

          # Remove defconfig check
          sed -i 's/check_defconfig//' ./common/build.config.gki

      # ==================== Add SUSFS Configuration ====================
      # Enable SUSFS hiding features
      - name: Add SUSFS Configuration
        if: inputs.enable_susfs
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      # ==================== Configure Kernel Name ====================
      - name: Configure Kernel Name
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          if [ -f "build/build.sh" ]; then
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            # Configure 6.1+ kernel
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
            rm -rf ./common/android/abi_gki_protected_exports_*
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          fi

          # Configure kernel name
          if [ -n "${{ inputs.version }}" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            sed -i '$s|echo "\$res"|echo "'"$CLEAN_VERSION"'"|' ./common/scripts/setlocalversion
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          elif [ ! -f "build/build.sh" ]; then
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            kmi_61="-android14-11-g${GHASH}-${BID}"
            sed -i "\$s|echo \"\$res\"|echo \"$kmi_61\"|" ./scripts/setlocalversion 2>/dev/null || true
            kmi_66="-g${GHASH}-${BID}-4k"
            sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${kmi_66}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
          fi

      # ==================== Custom Build Time ====================
      - name: Set Custom Build Time
        shell: bash
        run: |
          # Read input: if N/n or empty, use current UTC time
          INPUT_TIME="${{ inputs.build_time }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input build time: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using current UTC time: $DATESTR"
          fi

          # Export for subsequent compilation steps
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Only process common/scripts/mkcompile_h
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            echo "Writing build time to mkcompile_h: $DATESTR"
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
            fi
          else
            echo "Target file not found, skipping: $f"
          fi

      # ==================== Compile Kernel ====================
      # Compile the kernel with retry logic, auto-retries on timeout
      - name: Build — If error occurs, the KSU repo has not yet synced SUSFS code (wait for the KSU repo to be fixed)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            echo "::group::Build Notes"
            echo "Errors are uncommon unless the KSU and SUSFS repositories are out of sync."
            echo "Do not ask, do not rush — this has nothing to do with your effort or your feedback to me, as it is beyond my control."
            echo "Just wait for compatibility to be updated. If you are capable, submit code to the SukiSU repository yourself."
            echo "::endgroup::"
            
            echo "Current KSU latest commit date: ${KSU_LATEST_COMMIT_DATE}"
            echo "Current SUSFS latest commit date: ${SUSFS_LATEST_COMMIT_DATE}"
            set -ex
            cd "$KERNEL_ROOT"

            sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
            sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
            sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

            if [ -f "build/build.sh" ]; then
              # 5.x kernels use the legacy build script
              LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang" || exit 1
            else
              # 6.1+ kernels use Bazel build
              tools/bazel build --disk_cache=/home/runner/.cache/bazel --config=fast --lto=thin //common:kernel_aarch64_dist || exit 1
              strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
            fi

            echo "Errors are uncommon unless the KSU and SUSFS repositories are out of sync."
            echo "Do not ask, do not rush — this has nothing to do with your effort or your feedback to me, as it is beyond my control."
            echo "Just wait for compatibility to be updated. If you are capable, submit code to the SukiSU repository yourself."
            echo "Current KSU latest commit date: ${KSU_LATEST_COMMIT_DATE}"
            echo "Current SUSFS latest commit date: ${SUSFS_LATEST_COMMIT_DATE}"
            echo "If the dates differ or are too far apart, patches will fail and compilation will fail"
      # ==================== KPM Patches (SukiSU only) ====================
      # Apply KPM (Kernel Patch Module) patches for SukiSU
      - name: Apply KPM Patches (SukiSU/ReSukiSU/Next)
        if: inputs.use_kpm && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU' || inputs.ksu_variant == 'Next')
        run: |
          case "${{ inputs.android_version }}" in
            "android12"|"android13")
              if [ "${{ inputs.kernel_version }}" != "6.6" ]; then
                TARGET_PATH="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
              fi
              ;;
            "android14"|"android15")
              TARGET_PATH="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/"
              ;;
          esac

          cp -r $SUKISU_PATCHES/kpm/patch_linux "$TARGET_PATH/patch"
          cd "$TARGET_PATH"
          chmod 777 patch
          ./patch
          rm -rf Image
          mv oImage Image

      # ==================== Prepare Boot Image ====================
      # Copy compiled artifacts to the working directory
      - name: Prepare Boot Image
        run: |
          mkdir -p bootimgs

          if [ "${{ inputs.android_version }}" == "android12" ] || [ "${{ inputs.android_version }}" == "android13" ]; then
            SRC_DIR="$KERNEL_ROOT/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist"
          else
            SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          fi

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      # ==================== Create AnyKernel3 Archive ====================
      - name: Create AnyKernel3 Archive
        run: |
          cd $ANYKERNEL3
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      # ==================== Build Boot Image (Android 12) ====================
      # Android 12 requires extracting the ramdisk from the GKI certified image
      - name: Build Boot Image (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          # Create standard boot.img
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          # Create gzip-compressed boot.img
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          # Create lz4-compressed boot.img
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      # ==================== Build Boot Image (Android 13+) ====================
      # Android 13 and above do not require a ramdisk
      - name: Build Boot Image (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          # Create standard boot.img
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          # Create gzip-compressed boot.img
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          # Create lz4-compressed boot.img
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      # ==================== Collect Patch Conflict Files ====================
      # Collect all .rej files for debugging patch failures
      - name: Collect Patch Conflict Files
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== Upload Build Artifacts ====================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      # ==================== Upload Patch Conflict Files ====================
      - name: Upload Patch Conflict Files
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

